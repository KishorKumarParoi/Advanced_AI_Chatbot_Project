  <text x="55" y="155" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">1. CLIENT &amp; INGRESS</text>

  <rect x="55" y="175" width="160" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="68" y="200" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">Enterprise User</text>
  <text x="68" y="218" fill="#94a3b8" font-family="sans-serif" font-size="11">HTTPS / SSE Stream</text>
