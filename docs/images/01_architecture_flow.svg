  <text x="68" y="418" fill="#94a3b8" font-family="sans-serif" font-size="11">Core Orchestrator</text>
  <text x="68" y="434" fill="#c084fc" font-family="sans-serif" font-size="10">OpenAPI Swagger Docs</text>
